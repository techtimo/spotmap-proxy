# fly.toml app configuration file generated for spotmap-proxy on 2026-05-08T20:34:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'spotmap-proxy'
primary_region = 'fra'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[env]
  METRICS_PORT = "9877"
  OGN_STALE_SECONDS = "300"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[metrics]
  port = 9877
  path = "/metrics"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
